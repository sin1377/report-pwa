<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="J.A.R.V.I.S.">
<meta name="theme-color" content="#0a0e17">
<link rel="manifest" href="/report-pwa/manifest.json">
<link rel="icon" type="image/png" sizes="48x48" href="/report-pwa/icon-48.png">
<link rel="apple-touch-icon" sizes="192x192" href="/report-pwa/icon-192.png">
<title>世栋马上发 — 每日行情与健康档案</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

:root {
  --bg-primary: #0a0e17;
  --bg-card: #111827;
  --bg-card-hover: #1a2236;
  --accent: #00d4ff;
  --accent-glow: rgba(0,212,255,0.15);
  --accent-dim: #007a99;
  --warn: #ff6b35;
  --warn-glow: rgba(255,107,53,0.15);
  --success: #10b981;
  --text-primary: #e2e8f0;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --border: #1e293b;
  --border-glow: rgba(0,212,255,0.2);
  --font-mono: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, 'HarmonyOS Sans', 'PingFang SC', sans-serif;
}

*{margin:0;padding:0;box-sizing:border-box}

body {
  font-family: var(--font-sans);
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  background-image:
    radial-gradient(ellipse at 50% 0%, rgba(0,212,255,0.03) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 20%, rgba(0,212,255,0.02) 0%, transparent 50%);
}

/* Header - Arc Reactor style */
.header {
  background: linear-gradient(180deg, rgba(0,212,255,0.08) 0%, rgba(10,14,23,0) 100%);
  padding: 24px 16px 20px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}
.header-top {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
}
.arc-reactor {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent), 0 0 20px var(--accent-glow);
  animation: pulse-glow 2s ease-in-out infinite;
}
@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 8px var(--accent), 0 0 20px var(--accent-glow); }
  50% { box-shadow: 0 0 12px var(--accent), 0 0 30px var(--accent-glow); }
}
.header h1 {
  font-family: var(--font-mono);
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--text-primary);
}
.header h1 span {
  color: var(--accent);
}
.header .status-line {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.5px;
}
.header .status-line .dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--success);
  margin-right: 6px;
  box-shadow: 0 0 6px rgba(16,185,129,0.4);
}

/* Search - holographic style */
.search-wrap {
  margin: 12px 0 0;
  display: flex;
  gap: 8px;
}
.search-wrap input {
  flex: 1;
  padding: 10px 14px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}
.search-wrap input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-glow);
}
.search-wrap input::placeholder {
  color: var(--text-muted);
}
.search-wrap button {
  padding: 10px 16px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--accent);
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 0.5px;
  transition: all 0.2s;
}
.search-wrap button:active {
  background: var(--accent-glow);
  border-color: var(--accent);
}

/* Stats chips */
.stats {
  display: flex;
  gap: 6px;
  padding: 8px 16px 4px;
  overflow-x: auto;
  scrollbar-width: none;
}
.stats::-webkit-scrollbar { display: none }
.stat-chip {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 11px;
  color: var(--text-secondary);
  white-space: nowrap;
  font-family: var(--font-mono);
  flex-shrink: 0;
}
.stat-chip b {
  color: var(--accent);
  font-weight: 600;
}
.stat-chip.chip-active {
  border-color: var(--accent);
  background: var(--accent-glow);
  color: var(--accent);
}

/* 日期快跳条 */
.date-jump {
  display: flex;
  gap: 6px;
  padding: 6px 16px 2px;
  overflow-x: auto;
  scrollbar-width: none;
}
.date-jump::-webkit-scrollbar { display: none }
.date-jump:empty { display: none }
.date-pill {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 5px 12px;
  font-size: 11px;
  color: var(--text-secondary);
  white-space: nowrap;
  font-family: var(--font-mono);
  flex-shrink: 0;
  cursor: pointer;
}
.date-pill.today {
  border-color: var(--accent);
  color: var(--accent);
}
.date-pill.pill-active {
  background: var(--accent-glow);
  border-color: var(--accent);
  color: var(--accent);
}
/* 筛选状态横幅 */
.filter-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 6px 16px 0;
  padding: 8px 12px;
  background: var(--accent-glow);
  border: 1px solid var(--accent);
  border-radius: 8px;
  font-size: 12px;
  color: var(--accent);
}
.filter-banner .fb-clear {
  background: none;
  border: none;
  color: var(--accent);
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  padding: 0 4px;
}

/* Day cards */
.day-list {
  padding: 8px 16px 80px;
}
.day-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}
.day-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 3px;
  height: 100%;
  background: var(--accent);
  opacity: 0;
  transition: opacity 0.2s;
}
.day-card:active {
  background: var(--bg-card-hover);
  border-color: var(--border-glow);
}
.day-card.open::before {
  opacity: 1;
}
.day-card .date-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}
.day-card .date {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: 0.3px;
}
.day-card .dots {
  display: flex;
  gap: 5px;
}
.day-card .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
}
.dot-red { background: var(--warn); box-shadow: 0 0 6px rgba(255,107,53,0.4); }
.dot-green { background: var(--success); box-shadow: 0 0 6px rgba(16,185,129,0.4); }
.dot-grey { background: var(--text-muted); }
.day-card .summary {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.55;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.day-card .detail {
  display: none;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.day-card.open .detail { display: block }
.day-card.open .summary { -webkit-line-clamp: unset; overflow: visible }
.day-card.open {
  border-color: var(--border-glow);
}
.detail-section {
  margin-bottom: 10px;
}
.detail-section .label {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--accent);
  letter-spacing: 1px;
  margin-bottom: 4px;
  text-transform: uppercase;
}
.detail-section .value {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.65;
}

/* Empty state */
.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-muted);
}
.empty-state .icon {
  font-size: 48px;
  margin-bottom: 12px;
  opacity: 0.3;
}
.empty-state p {
  font-size: 14px;
  margin-bottom: 4px;
}

/* FAB - arc reactor style */
.fab {
  position: fixed;
  bottom: 24px;
  right: 20px;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--accent);
  font-size: 18px;
  cursor: pointer;
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
  box-shadow: 0 0 20px var(--accent-glow);
}
.fab:active {
  background: var(--accent-glow);
  border-color: var(--accent);
  box-shadow: 0 0 30px var(--accent-glow);
}

/* Footer status bar */
.status-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 6px 16px;
  background: rgba(10,14,23,0.95);
  border-top: 1px solid var(--border);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 0.5px;
  z-index: 300;
}
.status-bar .status-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--success);
  margin-right: 5px;
  display: inline-block;
  box-shadow: 0 0 5px rgba(16,185,129,0.4);
}

/* Offline banner */
.offline-banner {
  background: var(--warn);
  color: #fff;
  text-align: center;
  padding: 4px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 1px;
  display: none;
}
.offline-banner.show { display: block }

/* 启动闪屏 */
.splash {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg-primary);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.5s ease;
}
.splash.hide {
  opacity: 0;
  pointer-events: none;
}
.splash-core {
  text-align: center;
}
.splash-ring {
  width: 64px;
  height: 64px;
  margin: 0 auto 20px;
  border-radius: 50%;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  animation: splash-spin 1s linear infinite;
  box-shadow: 0 0 20px var(--accent-glow), inset 0 0 15px var(--accent-glow);
}
@keyframes splash-spin {
  to { transform: rotate(360deg); }
}
.splash-title {
  font-family: var(--font-mono);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 4px;
  color: var(--accent);
  text-shadow: 0 0 20px var(--accent-glow);
}
.splash-sub {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--text-muted);
  margin-top: 8px;
}
.splash-cn {
  font-family: var(--font-sans);
  font-size: 13px;
  letter-spacing: 6px;
  color: var(--accent);
  margin-top: 10px;
  opacity: 0.9;
  animation: splash-fade 1.2s ease-out;
}
@keyframes splash-fade {
  0% { opacity: 0; letter-spacing: 12px; }
  100% { opacity: 0.9; letter-spacing: 6px; }
}

@media(min-width: 768px) {
  .day-list, .stats, .search-wrap { max-width: 640px; margin-left: auto; margin-right: auto }
  .header { padding-left: calc(50% - 320px); padding-right: calc(50% - 320px) }
}
</style>
</head>
<body>
<div class="offline-banner" id="offlineBanner">📡 离线模式 — 显示缓存数据</div>

<!-- 启动闪屏：模拟原生 APP 启动画面 -->
<div class="splash" id="splash">
  <div class="splash-core">
    <div class="splash-ring"></div>
    <div class="splash-title">世栋马上发</div>
    <div class="splash-sub">系统启动中</div>
    <div class="splash-cn">欢迎世栋</div>
  </div>
</div>

<div class="header">
  <div class="header-top">
    <div class="arc-reactor"></div>
    <h1>世栋马上发</h1>
  </div>
  <div class="status-line">
    <span class="dot"></span> 系统运行中 · 早报档案馆 · 焦煤铝矿 + 健康简报
  </div>
  <div class="search-wrap">
    <input type="search" id="searchInput" placeholder="搜索历史档案..." oninput="filterDays()">
    <button onclick="scrollToToday()">回到今天</button>
  </div>
</div>

<div class="stats" id="statsRow"></div>
<div class="date-jump" id="dateJump"></div>
<div class="filter-banner" id="filterBanner" style="display:none"></div>
<div class="day-list" id="dayList"></div>

<button class="fab" onclick="goFullscreen()">⛶</button>

<div class="status-bar">
  <span><span class="status-dot"></span> 一切正常</span>
  <span id="lastUpdate">上次同步: --</span>
</div>

<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/report-pwa/sw.js').then(function(reg){
    // 检测到新版本 SW 时自动激活并刷新页面
    reg.addEventListener('updatefound', function(){
      var nw = reg.installing;
      if(!nw) return;
      nw.addEventListener('statechange', function(){
        if(nw.state === 'installed' && navigator.serviceWorker.controller){
          nw.postMessage({action:'SKIP_WAITING'});
        }
      });
    });
  });
  // SW 控制权更新后自动刷新（根治旧缓存）
  var refreshed = false;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if(refreshed) return;
    refreshed = true;
    location.reload();
  });
}

// 启动闪屏：1 秒后淡出
setTimeout(function(){
  var sp = document.getElementById('splash');
  if(sp){
    sp.classList.add('hide');
    setTimeout(function(){ sp.remove(); }, 600);
  }
}, 1000);

var REPORTS = [
  {
    "date": "2026-09-27",
    "label": "09-27 周日",
    "market": {
      "status": "grey",
      "summary": "数据生成中...每日8:30更新",
      "detail": "行情数据将在每日早报生成后自动更新。请稍后刷新页面。"
    },
    "health": {
      "status": "grey",
      "summary": "手表数据待同步",
      "detail": "⌚ 华为手表数据尚未同步。请确保华为健康App已绑定手表并开启数据同步。"
    },
    "intel": {
      "status": "grey",
      "summary": "情报生成中...每日凌晨更新",
      "detail": "🌍 全球市场情报与地缘政治分析将在每日凌晨自动更新。"
    }
  }
];
var __dataLoaded = false;
// 多源竞速：github.io 原始 + 国内可达 CDN（jsdelivr/huaweicloud/fastly）
var DATA_SOURCES = [
  'https://cdn.jsdelivr.net/gh/sin1377/report-pwa@main/data.js',
  'https://sin1377.github.io/report-pwa/data.js',
  'https://fastly.jsdelivr.net/gh/sin1377/report-pwa@main/data.js',
  'https://d29xt3x1l3l3fz.cloudfront.net/gh/sin1377/report-pwa@main/data.js',
  'https://cloudflare-jsdelivr-east.azureedge.net/gh/sin1377/report-pwa@main/data.js',
  'https://gcore.jsdelivr.net/gh/sin1377/report-pwa@main/data.js'
];
function tryLoadSources(i, onDone){
  if(i >= DATA_SOURCES.length){ onDone(false); return; }
  var url = DATA_SOURCES[i];
  var ctl = null;
  var s = document.createElement('script');
  var settled = false;
  var cleanup = function(){ if(ctl) clearTimeout(ctl); s.onload = s.onerror = null; };
  ctl = setTimeout(function(){ // 8 秒单源超时
    if(settled) return; settled = true; cleanup();
    s.parentNode && s.parentNode.removeChild(s);
    tryLoadSources(i+1, onDone);
  }, 8000);
  s.onload = function(){
    if(settled) return; settled = true; cleanup();
    if(window.REPORTS && window.REPORTS.length){ onDone(true, url); }
    else { tryLoadSources(i+1, onDone); }
  };
  s.onerror = function(){
    if(settled) return; settled = true; cleanup();
    tryLoadSources(i+1, onDone);
  };
  s.src = url + '?t=' + Date.now();
  document.head.appendChild(s);
}
function applyData(){
  __dataLoaded = true;
  renderStats(); renderDays();
  var now=new Date();
  var el=document.getElementById('lastUpdate');
  if(el) el.textContent='上次同步: '+now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
}
// 启动：先用内嵌最小骨架（无数据提示），随后竞速拉取
tryLoadSources(0, function(ok, url){
  if(ok){ applyData(); }
  else {
    var c=document.getElementById('dayList');
    if(c) c.innerHTML='<div class="empty-state"><div class="icon">⚠</div><p>数据加载失败，请检查网络后下拉刷新</p></div>';
  }
});

var FILTER_MODE = 'all'; // all | market | health | intel
var JUMP_DATE = null;  // 当前选中的日期胶囊

function renderStats(){
  var t=REPORTS.length;
  var now=new Date();
  var ymNow=now.getFullYear()+'-'+(now.getMonth()+1).toString().padStart(2,'0');
  var m=REPORTS.filter(function(r){return r.date.slice(0,7)===ymNow}).length;
  document.getElementById('statsRow').innerHTML=
    '<div class="stat-chip" onclick="resetFilter()">📅 <b>'+t+'</b> 天</div>'+
    '<div class="stat-chip '+(FILTER_MODE==='month'?'chip-active':'')+'" onclick="filterThisMonth()">本月 <b>'+m+'</b> 篇</div>'+
    '<div class="stat-chip '+(FILTER_MODE==='market'?'chip-active':'')+'" onclick="setFilter(\'market\')">🪨 焦煤铝矿</div>'+
    '<div class="stat-chip '+(FILTER_MODE==='health'?'chip-active':'')+'" onclick="setFilter(\'health\')">❤️ 健康简报</div>'+
    '<div class="stat-chip '+(FILTER_MODE==='intel'?'chip-active':'')+'" onclick="setFilter(\'intel\')">🌍 市场情报</div>';
  renderDateJump();
  renderFilterBanner();
}
// 日期快跳胶囊条
function renderDateJump(){
  var c=document.getElementById('dateJump');
  var pills=REPORTS.map(function(r){
    var d=r.date.slice(5).replace('-','/');
    var isToday=r.date===REPORTS[0].date;
    var act=JUMP_DATE===r.date?' pill-active':'';
    return '<div class="date-pill'+(isToday&&!JUMP_DATE?' today':'')+act+'" onclick="jumpToDate(\''+r.date+'\')">'+d+'</div>';
  }).join('');
  c.innerHTML=pills;
}
function jumpToDate(d){
  JUMP_DATE=(JUMP_DATE===d)?null:d;
  renderStats();
  renderDays(document.getElementById('searchInput').value);
  if(JUMP_DATE){
    var idx=window.findCardByDate(JUMP_DATE);
    var el=document.getElementById('card-'+idx);
    if(el){el.scrollIntoView({behavior:'smooth',block:'start'});el.classList.add('open');setTimeout(function(){el.classList.remove('open')},2500);}
  } else { scrollToToday(); }
}
// 筛选状态横幅
function renderFilterBanner(){
  var b=document.getElementById('filterBanner');
  var txt=null;
  if(FILTER_MODE==='market')txt='🪨 只看焦煤铝矿行情';
  if(FILTER_MODE==='health')txt='❤️ 只看健康简报';
  if(FILTER_MODE==='intel')txt='🌍 只看市场情报';
  if(FILTER_MODE==='month')txt='📅 只看本月';
  if(JUMP_DATE)txt='📌 只看 '+JUMP_DATE;
  if(!txt){b.style.display='none';return;}
  b.style.display='flex';
  b.innerHTML='<span>'+txt+'</span><button class="fb-clear" onclick="resetFilter()">✕</button>';
}
function setFilter(mode){
  FILTER_MODE = (FILTER_MODE===mode) ? 'all' : mode;
  JUMP_DATE=null;
  renderStats();renderDays(document.getElementById('searchInput').value);
}
function resetFilter(){
  FILTER_MODE='all';
  JUMP_DATE=null;
  document.getElementById('searchInput').value='';
  renderStats();renderDays();
  scrollToToday();
}
function filterThisMonth(){
  var now=new Date();
  var ym=now.getFullYear()+'-'+(now.getMonth()+1).toString().padStart(2,'0');
  var input=document.getElementById('searchInput');
  FILTER_MODE=(FILTER_MODE==='month')?'all':'month';
  JUMP_DATE=null;
  if(FILTER_MODE==='month'){input.value=ym;}else{input.value='';}
  renderStats();renderDays(input.value);
}
function renderDays(ft){
  var c=document.getElementById('dayList');
  var f=REPORTS;
  if(ft&&ft.trim()){
    var q=ft.trim().toLowerCase();
    f=REPORTS.filter(function(r){return r.date.indexOf(q)!==-1||r.label.toLowerCase().indexOf(q)!==-1});
  }
  if(f.length===0){
    c.innerHTML='<div class="empty-state"><div class="icon">◈</div><p>没有找到相关记录</p></div>';
    return;
  }
  c.innerHTML=f.map(function(r,i){
    var m=r.market,h=r.health,it=r.intel;
      return '<div class="day-card" id="card-'+i+'" onclick="var el=document.getElementById(\'card-'+i+'\');el.classList.toggle(\'open\')"><div class="date-row"><span class="date">📅 '+r.label+'</span><span class="dots">'+(it?'<span class="dot dot-'+it.status+'"></span>':'')+'<span class="dot dot-'+m.status+'"></span><span class="dot dot-'+h.status+'"></span></span></div>'+
      (it&&(FILTER_MODE==='all'||FILTER_MODE==='intel')?'<div class="summary">🌍 '+it.summary+'</div>':'')+
      (FILTER_MODE!=='health'?'<div class="summary">🪨 '+m.summary+'</div>':'')+
      (FILTER_MODE!=='market'?'<div class="summary" style="margin-top:2px">❤️ '+h.summary+'</div>':'')+
      '<div class="detail">'+
      (it?'<div class="detail-section"><div class="label">🌍 市场情报 · 独立分析</div><div class="value">'+it.detail.replace(/\n/g,'<br>')+'</div></div>':'')+
      '<div class="detail-section"><div class="label">🪨 焦煤铝矿行情</div><div class="value">'+m.detail.replace(/\n/g,'<br>')+'</div></div><div class="detail-section"><div class="label">❤️ 健康简报</div><div class="value">'+h.detail.replace(/\n/g,'<br>')+'</div></div></div></div>';
  }).join('');
}
function filterDays(){renderDays(document.getElementById('searchInput').value)}
function scrollToToday(){document.getElementById('searchInput').value='';renderDays();var card=document.querySelector('.day-card');if(card)card.scrollIntoView({behavior:'smooth'})}
window.findCardByDate=function(date){for(var i=0;i<REPORTS.length;i++){if(REPORTS[i].date===date)return i}return -1}

// 全屏模式：隐藏浏览器地址栏，接近原生 APP 体验
function goFullscreen(){
  var el=document.documentElement;
  var req=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen;
  if(req){
    req.call(el).catch(function(){});
  }
}
// 退出全屏提示
function exitFullscreen(){
  if(document.fullscreenElement||document.webkitFullscreenElement){
    var ex=document.exitFullscreen||document.webkitExitFullscreen;
    if(ex)ex.call(document);
  }
}

function updateOnlineStatus(){
  var banner=document.getElementById('offlineBanner');
  if(navigator.onLine){banner.classList.remove('show')}else{banner.classList.add('show')}
}
window.addEventListener('online',updateOnlineStatus);
window.addEventListener('offline',updateOnlineStatus);
updateOnlineStatus();

// Update last sync time
var now=new Date();
document.getElementById('lastUpdate').textContent='上次同步: '+now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');

renderStats();renderDays();
</script>
</body>
</html>
